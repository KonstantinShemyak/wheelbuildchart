name: Static checks

on: pull_request

jobs:

  block-merge-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Block merge commits
        uses: motlin/forbid-merge-commits-action@v1.0.4

  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Format whitespace
        run: npm run check-format

      - name: TypeScript type check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Build production bundle
        if: ${{ !cancelled() }}
        run: npm run build

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      tensometers: ${{ steps.filter.outputs.tensometers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect tensometer-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tensometers:
              - 'src/data/tensometers/**'
              - 'src/data/tensometer.schema.json'

  validate-tensometers:
    needs: detect-changes
    if: needs.detect-changes.outputs.tensometers == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install check-jsonschema
        run: pipx install check-jsonschema

      - name: Validate tensometer YAML files against schema
        run: check-jsonschema --schemafile src/data/tensometer.schema.json src/data/tensometers/*.yaml
