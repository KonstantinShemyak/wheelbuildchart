# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      # The test runner and the browser library must be at the same version,
      # otherwise the browsers in the Playwright Docker image (picked by the
      # @playwright/test version) do not match and the snapshot tests fail.
      playwright:
        patterns:
          - "playwright"
          - "@playwright/test"
